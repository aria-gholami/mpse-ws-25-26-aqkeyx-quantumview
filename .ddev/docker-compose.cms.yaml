services:
  cms:
    container_name: ddev-${DDEV_SITENAME}-cms
    restart: unless-stopped
    build:
      context: ./../cms
      dockerfile: ../cms/Dockerfile.dev
    volumes:
      - ./../cms:/var/www/cms
    labels:
      com.ddev.site-name: ${DDEV_SITENAME}
      com.ddev.approot: $DDEV_APPROOT
    environment:
      - VIRTUAL_HOST=$DDEV_HOSTNAME
      - HTTP_EXPOSE=8003:8003
      - HTTPS_EXPOSE=8003:8003
    networks:
      - ddev_default

networks:
  ddev_default:
    external: true
    name: ddev_default