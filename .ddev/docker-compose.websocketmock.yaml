services:
  websocketmock:
    container_name: ddev-${DDEV_SITENAME}-websocketmock
    restart: unless-stopped
    build:
      context: ../.websocketmock
      dockerfile: Dockerfile
    volumes:
      - ./../.websocketmock:/app
      - websocketmock_node_modules:/app/node_modules
    labels:
      com.ddev.site-name: ${DDEV_SITENAME}
      com.ddev.approot: $DDEV_APPROOT
    environment:
      - VIRTUAL_HOST=$DDEV_HOSTNAME
      - HTTP_EXPOSE=8002:8001
      - HTTPS_EXPOSE=8001:8001
    networks:
      - ddev_default
    expose:
      - "8001"

volumes:
  websocketmock_node_modules:

networks:
  ddev_default:
    external: true
    name: ddev_default