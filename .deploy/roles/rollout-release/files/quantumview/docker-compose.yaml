services:
  reverse-proxy:
    container_name: reverse-proxy
    restart: unless-stopped
    image: nginx:alpine
    ports:
      - '80:80'
    volumes:
      - ./reverse-proxy/.htpasswd:/etc/nginx/.htpasswd
      - ./reverse-proxy/default.conf:/etc/nginx/conf.d/default.conf:ro
    networks:
      - quantumview-aqkeyx-benchmark-network
    depends_on:
      - quantumview

  quantumview:
    container_name: quantumview
    restart: unless-stopped
    image: registry.code.fbi.h-da.de/mpse-ws-25-26-quantum-safe-tec/mpse-ws-25-26-aqkeyx-quantumview:latest
    volumes:
      - ./quantumview/default.conf:/etc/nginx/conf.d/default.conf:ro
    networks:
      - quantumview-aqkeyx-benchmark-network

  cms:
    container_name: cms
    restart: unless-stopped
    image: registry.code.fbi.h-da.de/mpse-ws-25-26-quantum-safe-tec/mpse-ws-25-26-aqkeyx-quantumview/cms:latest
    volumes:
      - sulu_public_uploads:/var/www/cms/public/uploads
      - sulu_var_uploads:/var/www/cms/var/uploads
    command: >
      sh -lc "
        php bin/console doctrine:database:create --if-not-exists &&
        exec frankenphp run --config /etc/caddy/Caddyfile
      "
    networks:
      - quantumview-aqkeyx-benchmark-network
    depends_on:
      - mysql

  mysql:
    container_name: mysql
    restart: unless-stopped
    image: mysql:9.5
    ports:
      - '3306:3306'
    environment:
      MYSQL_DATABASE: db
      MYSQL_USER: quantumview
      MYSQL_ROOT_PASSWORD_FILE: /run/secrets/mysql_root_password
      MYSQL_PASSWORD_FILE: /run/secrets/mysql_quantumview_password
    secrets:
      - mysql_root_password
      - mysql_quantumview_password
    volumes:
      - mysql_data:/var/lib/mysql
    networks:
      - quantumview-aqkeyx-benchmark-network

secrets:
  mysql_root_password:
    file: secrets/mysql_root_password.txt
  mysql_quantumview_password:
    file: secrets/mysql_quantumview_password.txt

volumes:
  mysql_data:
  sulu_public_uploads:
  sulu_var_uploads:

networks:
  quantumview-aqkeyx-benchmark-network:
    external: true