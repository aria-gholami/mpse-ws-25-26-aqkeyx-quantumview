map $http_upgrade $connection_upgrade {
  default upgrade;
  ''      close;
}

server {
    listen       80;
    listen  [::]:80;
    server_name  reverse-proxy;

    access_log  /var/log/nginx/reverse-proxy.access.log main;

    auth_basic           "Restricted";
    auth_basic_user_file /etc/nginx/.htpasswd;

    add_header X-Content-Type-Options nosniff;
    add_header X-Frame-Options DENY;
    add_header Access-Control-Allow-Origin *;
    add_header Access-Control-Allow-Methods "GET";
    add_header Access-Control-Allow-Headers "Origin, Content-Type, Accept, Authorization";

    location / {
        proxy_pass http://quantumview:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location = /admin { return 301 /cms/admin/; }
    location = /admin/ { return 301 /cms/admin/; }
    location ^~ /admin/ {
        auth_basic off;
        rewrite ^/admin/(.*)$ /cms/admin/$1 last;
    }
    location ^~ /build/ {
        auth_basic off;
        rewrite ^/build/(.*)$ /cms/build/$1 last;
    }
    location /cms/ {
        auth_basic off;
        proxy_pass http://cms:8001/;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Prefix /cms;
    }

    location /api/v1/ {
        proxy_pass http://aqkeyx-benchmark-webservice:8000/;
        proxy_set_header Host $host;
    }

    location /websocket/ {
        auth_basic off;

        proxy_pass http://aqkeyx-benchmark-webservice:8000/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 3600;
        proxy_send_timeout 3600;
        proxy_buffering off;
    }
}
